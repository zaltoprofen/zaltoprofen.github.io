baseURL: https://zaltoprofen.github.io/
languageCode: ja-jp
title: Monochrome Memory

theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Monochrome Memory
  keywords: [Diary]
  author: zaltoprofen
  DateFormat: "2006-01-02"
  defaultTheme: auto

  ShowReadingTime: false
  ShowShareButtons: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowHugoToc: true
  disableSpecial1stPost: true
  comments: false
  hidemeta: false
  showSummary: false
  showtoc: false
  tocopen: false

  profileMode:
    enabled: false

  socialIcons:
    - name: x
      url: https://x.com/zaltoprofen

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    limit: 10
    keys: ["title", "permalink", "summary", "content"]

menu:
  main:
    - identifier: categories
      name: categories
      url: /categories/
      weight: 10
    - identifier: tags
      name: tags
      url: /tags/
      weight: 20
